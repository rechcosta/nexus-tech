name: nexus_tech
description: "Plataforma mobile que conecta organizações externas a professores do IFRS Campus Osório."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1

  # Estado
  provider: ^6.1.2

  # Sprint 2 — anexos
  file_picker: ^8.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png